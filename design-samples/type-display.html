<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Display type — fonts (Studio)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Fraunces:opsz,wght@9..144,600&family=DM+Serif+Display&family=Space+Grotesk:wght@600&display=swap" rel="stylesheet" />
<style>
  :root { --page-bg: #141310; --page-text: #ecece6; --page-dim: #9a968c; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page-bg); color: var(--page-text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; padding: 40px 28px 80px;
  }
  h1 { font-size: 26px; margin: 0 0 6px; font-weight: 700; letter-spacing: -0.02em; }
  .sub { color: var(--page-dim); font-size: 14px; margin: 0 0 32px; max-width: 820px; line-height: 1.5; }

  #board { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; align-items: start; }

  .variant { border-radius: 18px; padding: 24px; background: #fcfbf8; color: #1c1a17; border: 1px solid #dcd8cc; }
  .variant h2 { font-size: 15px; margin: 0 0 4px; font-weight: 600; }
  .variant .note { font-size: 12px; color: #9a9488; margin: 0 0 20px; }

  .hero-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #9a9488; font-weight: 600; margin: 22px 0 8px; }
  .big-greet { font-size: 30px; letter-spacing: -0.01em; line-height: 1.1; }
  .nav-title { font-size: 24px; letter-spacing: -0.01em; }

  .phone {
    width: 270px; margin: 16px 0 0; border-radius: 34px;
    background: #fcfbf8; color: #1c1a17;
    border: 1px solid #dcd8cc; box-shadow: 0 12px 40px rgba(0,0,0,0.22);
    padding: 12px 13px 16px;
  }
  .statusbar { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #6b675e; padding: 0 4px 10px; font-weight: 600; }
  .sig { display: inline-flex; gap: 2px; align-items: flex-end; height: 10px; }
  .sig i { width: 3px; background: #6b675e; border-radius: 1px; }
  .sig i:nth-child(1){height:4px} .sig i:nth-child(2){height:7px} .sig i:nth-child(3){height:10px}
  .greet { font-size: 12px; color: #9a9488; }
  .greet strong { display: block; font-size: 24px; color: #1c1a17; letter-spacing: -0.01em; margin-top: 2px; }
  .talk { margin: 12px 0 4px; background: #0F766E; color: #fff; border-radius: 14px; padding: 13px; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 7px; }
  .talk svg { width: 16px; height: 16px; }
  .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #9a9488; font-weight: 600; margin: 14px 0 8px; }
  .row { background: #f4f2ec; border: 1px solid #dcd8cc; border-radius: 12px; padding: 10px 11px; margin-top: 8px; display: flex; align-items: center; gap: 10px; }
  .row .grow { flex: 1; min-width: 0; }
  .row .ttl { font-size: 13px; font-weight: 600; }
  .row .meta { font-size: 11px; color: #9a9488; }
  .pill { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
  .pill-warn { background: rgba(178,106,0,0.14); color: #b26a00; }
  .pill-ok { background: rgba(31,122,77,0.14); color: #1f7a4d; }
  .tabbar { display: flex; justify-content: space-around; margin-top: 16px; padding-top: 10px; border-top: 1px solid #dcd8cc; font-size: 11px; color: #6b675e; }
  .tabbar .on { color: #0F766E; font-weight: 600; }
</style>
</head>
<body>
  <h1>Display type — fonts (Studio palette)</h1>
  <p class="sub">Same content, same palette. Only the <em>display</em> font changes (screen titles + greeting). Body, metadata, and UI stay SF Pro in every option. Options 6–9 load from Google Fonts (needs internet).</p>

  <div id="board"></div>

  <script>
    const MIC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>';

    const options = [
      { label: 'Option 1 — Serif (New York)', note: 'System serif. Editorial, like print.', weight: 600,
        font: '"New York", Georgia, "Times New Roman", serif' },
      { label: 'Option 2 — Sans (SF Pro)', note: 'System-native, quiet, tool-like.', weight: 700,
        font: '-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif' },
      { label: 'Option 3 — Mono (SF Mono)', note: 'Precise, engineering / manuscript.', weight: 600,
        font: 'ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", monospace' },
      { label: 'Option 4 — Slab serif (Rockwell)', note: 'Sturdy, confident.', weight: 700,
        font: '"Rockwell", "Roboto Slab", Georgia, serif' },
      { label: 'Option 5 — Small caps', note: 'Serif small caps, tracked out. Masthead feel.', weight: 600, caps: true,
        font: '"New York", Georgia, "Times New Roman", serif' },
      { label: 'Option 6 — Playfair Display', note: 'High-contrast Didone. Elegant, magazine.', weight: 600,
        font: '"Playfair Display", Georgia, serif' },
      { label: 'Option 7 — Fraunces', note: 'Old-style "wonky" serif. Warm, characterful.', weight: 600,
        font: '"Fraunces", Georgia, serif' },
      { label: 'Option 8 — DM Serif Display', note: 'Sturdy display serif, friendly.', weight: 400,
        font: '"DM Serif Display", Georgia, serif' },
      { label: 'Option 9 — Space Grotesk', note: 'Geometric sans. Techy but tasteful.', weight: 600,
        font: '"Space Grotesk", "SF Pro Text", sans-serif' },
    ];

    const board = document.getElementById('board');

    for (const o of options) {
      const cap = o.caps ? 'font-variant-caps:small-caps;letter-spacing:0.05em;' : '';
      const displayStyle = 'font-family:' + o.font + ';font-weight:' + o.weight + ';' + cap;

      const el = document.createElement('section');
      el.className = 'variant';
      el.innerHTML =
        '<h2>' + o.label + '</h2>' +
        '<p class="note">' + o.note + '</p>' +

        '<div class="hero-label">Display</div>' +
        '<div class="big-greet" style="' + displayStyle + '">Good morning, Alex</div>' +

        '<div class="hero-label">Nav title</div>' +
        '<div class="nav-title" style="' + displayStyle + '">Sessions</div>' +

        '<div class="phone">' +
          '<div class="statusbar"><span>9:41</span><span class="sig"><i></i><i></i><i></i></span></div>' +
          '<div class="greet">Good morning<strong style="' + displayStyle + '">Alex</strong></div>' +
          '<div class="talk">' + MIC + 'Talk</div>' +
          '<div class="lbl">Recent</div>' +
          '<div class="row"><div class="grow"><div class="ttl">Vacuum research</div><div class="meta">2 agents · 4 artifacts</div></div><span class="pill pill-warn">Running</span></div>' +
          '<div class="row"><div class="grow"><div class="ttl">Project design</div><div class="meta">Shared · 3 people</div></div><span class="pill pill-ok">Done</span></div>' +
          '<div class="tabbar"><span class="on">Home</span><span>Sessions</span><span>Agents</span><span>Jobs</span></div>' +
        '</div>';

      board.appendChild(el);
    }
  </script>
</body>
</html>
