services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: asd
      POSTGRES_PASSWORD: asd
      POSTGRES_DB: asd
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asd -d asd"]
      interval: 5s
      timeout: 3s
      retries: 10

  asd-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: asd-server:latest
    init: true
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: "postgresql://asd:asd@db:5432/asd?schema=public"
      # Required. Set in .env (same dir as this file) or the shell.
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env before deploying}"
      PORT: "4000"
      # Comma-separated list of allowed origins, or "*" to reflect any origin.
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
      # Optional LLM engine (empty LLM_API_KEY uses the deterministic fallback).
      LLM_PROVIDER: "${LLM_PROVIDER:-openai}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-gpt-4o-mini}"
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      # Idempotent seed on start; set to "false" to skip.
      SEED_ON_START: "${SEED_ON_START:-true}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
